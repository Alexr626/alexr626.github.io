<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f8fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1420" media="(prefers-color-scheme: dark)">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  {% seo title=false %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% include person-jsonld.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ content }}
  <footer class="site-footer">
    <p>Last updated: {{ site.time | date: '%B %Y' }}</p>
  </footer>
</body>
</html>
