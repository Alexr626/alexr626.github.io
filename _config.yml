# Site settings. Page content lives in _data/, _includes/about.md and
# _includes/background.md; see README.md.

title: Alexander Romanus
description: >-
  Machine Learning Engineer at Nokia using mechanistic interpretability to understand
  and control vision-language models.
url: https://alexr626.github.io
baseurl: ""
lang: en_US
author: Alexander Romanus

# No GitHub Pages theme: the layouts and CSS here are the whole site.
theme: null

# The headshot is square, so link previews use the small card.
twitter:
  card: summary

# Default Open Graph / Twitter card image for every page.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/headshot.jpg

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

sass:
  style: compressed

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - AGENTS.md
  - README.md
  - Gemfile
  - Gemfile.lock
  - source-materials/
  - vendor/
  - .bundle/
