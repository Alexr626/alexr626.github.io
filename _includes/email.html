{%- assign p = site.data.profile -%}
{%- if p.email_user contains "[[" or p.email_user == "" -%}
Email <span class="todo">{{ p.email_user }}</span>
{%- else -%}
<span class="email"><span class="email-label">Email</span> {{ p.email_user | replace: ".", " [dot] " }} [at] {{ p.email_domain | replace: ".", " [dot] " }}</span>
{%- endif -%}
